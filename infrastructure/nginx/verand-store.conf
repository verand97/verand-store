# Nginx reverse proxy for Verand Store
# Frontend (Next.js) on :3000, Backend API (Laravel) on :8000.

upstream verand_frontend { server 127.0.0.1:3000; }
upstream verand_backend  { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name verand.store www.verand.store;

    # Redirect to HTTPS in production
    # return 301 https://$host$request_uri;

    client_max_body_size 16m;

    # API → Laravel
    location /api/ {
        proxy_pass http://verand_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (progress screenshots)
    location /storage/ {
        proxy_pass http://verand_backend;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://verand_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
